; Notes de cours 420-1C4 : PlatformIO – Hello World
; Section 5.1 – Hello World avec une DEL (LED)

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; Filtres du moniteur série (section 5.1 des notes) :
;   default   retire les caractères de contrôle
;   time      horodatage des lignes
;   log2file  copie les Serial.print dans un fichier du dossier « logs » du projet
monitor_filters =
  default
  time
  log2file
