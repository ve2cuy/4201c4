# Quiz du document 1 - Introduction aux microcontrôleurs (Documents/Introduction-microcontroleurs.md).
# Le nom du fichier est celui du document, sans .md. Voir GUIDE.md, « Quiz de compréhension ».
titre: Quiz de compréhension
nombre: 10   # questions tirées au hasard dans la banque à chaque essai
questions:
  - question: "Un microcontrôleur intègre, dans une seule puce, le processeur, la mémoire et les entrées/sorties."
    type: vf
    reponse: vrai
    explication: "C'est ce qui le distingue d'un ordinateur classique, qui utilise des composants séparés (section 1)."

  - question: "Quel microcontrôleur se trouve sur l'Arduino Uno?"
    choix: ["ATmega2560", "ATmega328P", "ESP32", "RP2040"]
    reponse: 2
    explication: "L'ATmega2560 est celui de l'Arduino Mega (section 5)."

  - question: "Que désigne l'acronyme GPIO?"
    choix:
      - "Une entrée/sortie à usage général"
      - "Un processeur graphique intégré"
      - "Un port réservé à la programmation"
      - "Un générateur d'impulsions"
    reponse: 1
    explication: "General Purpose Input/Output : une broche qui peut adopter plusieurs fonctions (lecture digitale, PWM, interruption…) (section 6)."

  - question: "Un signal digital peut prendre une multitude d'états, comme la valeur lue d'un potentiomètre."
    type: vf
    reponse: faux
    explication: "Un signal digital n'a que deux états (0/1). C'est un signal analogique qui peut en prendre une multitude (section 6)."

  - question: "Quel protocole de communication ne demande que deux lignes, SDA et SCL?"
    choix: ["SPI", "UART", "I2C", "CAN"]
    reponse: 3
    explication: "I2C (Inter-Integrated Circuit). SPI en demande quatre : SCK, CS, MOSI et MISO (section 6)."

  - question: "Sur l'Arduino Uno, l'horloge de l'ATmega328P tourne à 20 MHz."
    type: vf
    reponse: faux
    explication: "L'ATmega328P peut aller jusqu'à 20 MHz, mais l'horloge de l'Arduino Uno est de 16 MHz, soit environ 16 MIPS (section 6.1)."

  - question: "Combien de mémoire vive (SRAM) l'ATmega328P possède-t-il?"
    choix: ["1024 octets", "2048 octets", "32 Ko", "64 Ko"]
    reponse: 2
    explication: "2048 octets de SRAM; 32 Ko est la taille de la mémoire programme (Flash) et 1024 octets celle de l'EEPROM (section 6.1)."

  - question: "Quelle technique simule la gradation d'un signal sur une sortie digitale en variant la durée des états ON et OFF?"
    choix: ["ADC", "PWM", "DAC", "ICSP"]
    reponse: 2
    explication: "La modulation de largeur d'impulsion (PWM), par exemple pour varier l'intensité d'une DEL (section 6)."

  - question: "À quoi sert le programme d'amorçage (bootloader) d'un Arduino?"
    choix:
      - "À accélérer l'horloge du processeur au démarrage"
      - "À effacer l'EEPROM à chaque démarrage"
      - "À programmer le microcontrôleur par le UART, sans programmateur matériel"
      - "À convertir les signaux analogiques en valeurs numériques"
    reponse: 3
    explication: "Au démarrage, il attend une séquence de programmation sur le UART; sinon, il passe la main au programme de l'utilisateur (section 8)."

  - question: "Il faut un programmateur matériel, ou un autre microcontrôleur, pour écrire dans la zone mémoire du bootloader."
    type: vf
    reponse: vrai
    explication: "Le bootloader ne peut pas se réécrire lui-même : on passe par le connecteur ICSP (sections 6 et 8)."

  - question: "Les microcontrôleurs sont aussi parfois appelés « System on a Chip » (SoC)."
    type: vf
    reponse: vrai
    explication: "Ils réunissent dans un même boîtier le processeur, les mémoires et les périphériques (section 1)."

  - question: "Que signifie l'acronyme du boîtier DIP?"
    choix: ["Dual Inline Package", "Digital Input Port", "Direct Integrated Processor", "Dual Interface Protocol"]
    reponse: 1
    explication: "Le boîtier à deux rangées de broches, comme l'ATmega328P de l'Arduino Uno (section 4)."

  - question: "Quelle entreprise fabrique la série de microcontrôleurs ESP (ESP8266, ESP32)?"
    choix: ["Microchip", "Espressif", "STMicroelectronics", "Raspberry Pi"]
    reponse: 2
    explication: "Microchip fait les PIC (et les AVR depuis l'achat d'Atmel), STMicroelectronics les STM32 (section 5)."

  - question: "L'ESP32 est un microcontrôleur 8 bits."
    type: vf
    reponse: faux
    explication: "L'ESP8266 et l'ESP32 sont des microcontrôleurs 32 bits; l'ATmega328P et l'ATmega2560 sont des 8 bits (section 5)."

  - question: "Quelle est la taille de la mémoire programme (Flash) de l'ATmega328P?"
    choix: ["2 Ko", "32 Ko", "1 Ko", "256 Ko"]
    reponse: 2
    explication: "32 Ko, soit 32768 octets (section 6.1)."

  - question: "À quoi sert un convertisseur ADC?"
    choix:
      - "À convertir une valeur numérique en signal analogique"
      - "À synchroniser les échanges I2C"
      - "À convertir un signal analogique en valeur numérique"
      - "À détecter une chute de tension"
    reponse: 3
    explication: "Analog to Digital Converter. Le DAC fait l'inverse (section 6)."

  - question: "Quelle fonction d'un microcontrôleur détecte un blocage du code?"
    choix: ["Le WatchDog", "Le Brown-out (BOD)", "Le comparateur analogique", "Le PWM"]
    reponse: 1
    explication: "Le Brown-out détecte plutôt une chute de tension de l'alimentation (section 1)."

  - question: "Le Brown-out (BOD) d'un microcontrôleur détecte une chute de tension de l'alimentation électrique."
    type: vf
    reponse: vrai
    explication: "C'est une des fonctionnalités qu'un MCU peut intégrer (section 1)."

  - question: "En informatique, 1 Ko vaut 1024 octets."
    type: vf
    reponse: vrai
    explication: "Les processeurs calculent en base 2 : 2¹⁰ = 1024 (section 6)."

  - question: "Sous Windows, comment est identifiée une interface UART (port série)?"
    choix: ["/dev/tty*", "COMn (COM1, COM2…)", "USBn", "LPTn"]
    reponse: 2
    explication: "Sous macOS et Linux, c'est /dev/tty* (section 6)."

  - question: "Lequel de ces signaux n'appartient pas au protocole SPI?"
    choix: ["SCK", "MOSI", "MISO", "SDA"]
    reponse: 4
    explication: "SDA est une ligne de l'I2C. SPI utilise SCK, CS, MOSI et MISO (section 6)."

  - question: "Le protocole CAN est utilisé principalement dans l'industrie automobile."
    type: vf
    reponse: vrai
    explication: "Controller Area Network (section 6)."

  - question: "Que permet le connecteur ICSP?"
    choix:
      - "Brancher un écran LCD"
      - "Reprogrammer le microcontrôleur alors qu'il est en place dans le circuit"
      - "Alimenter la carte en 12 volts"
      - "Relier la carte à un réseau Wi-Fi"
    reponse: 2
    explication: "In-Circuit Serial Programming : il expose les signaux SPI; sur l'Arduino, il sert à programmer le bootloader (section 6)."

  - question: "Une interruption (INT) d'un microcontrôleur et le type « int » du langage C désignent la même chose."
    type: vf
    reponse: faux
    explication: "Une interruption permet de réagir de façon asynchrone à un événement; « int » est un type d'entier (section 6)."

  - question: "Quel langage utiliserons-nous dans ce cours pour programmer les microcontrôleurs?"
    choix: ["Java", "MicroPython", "C(++)", "Assembleur"]
    reponse: 3
    explication: "Le C et le C++ sont les langages les plus utilisés pour les MCU (section 7.4)."

  - question: "Où est enregistré le bootloader de l'ATmega328P?"
    choix:
      - "Dans l'EEPROM"
      - "Dans la SRAM"
      - "Sur une carte SD"
      - "Dans les premiers 2 Ko de la mémoire programme"
    reponse: 4
    explication: "Il occupe au plus 2 Ko de la mémoire Flash (section 8)."

  - question: "La plupart des microcontrôleurs proposent une interface USB pour leur programmation."
    type: vf
    reponse: faux
    explication: "L'USB est coûteux à implémenter et demande une horloge de 48 MHz; presque tous proposent plutôt un USART (section 8)."

  - question: "Quel est le léger désavantage du bootloader?"
    choix:
      - "Il occupe toute la mémoire vive"
      - "Il ajoute un délai au démarrage avant le programme principal"
      - "Il empêche d'utiliser le UART dans le programme"
      - "Il exige un programmateur matériel à chaque téléversement"
    reponse: 2
    explication: "Au démarrage, il attend quelques instants une éventuelle séquence de programmation (section 8)."

  - question: "Les schémas des cartes électroniques Arduino sont publiés sous licence libre."
    type: vf
    reponse: vrai
    explication: "Certaines composantes, comme le microcontrôleur, ne sont toutefois pas sous licence libre (section 9)."

  - question: "Combien de broches d'entrée/sortie à usage général (GPIO) l'ATmega328P possède-t-il?"
    choix: ["6", "14", "23", "32"]
    reponse: 3
    explication: "23 GPIO (PB0..PB7, PC0..PC6, PD0..PD7) sur un boîtier de 32 broches; l'Arduino Uno ne les expose pas toutes (section 6.1)."
