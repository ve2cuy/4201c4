# Quiz du document 2 - Introduction à PlatformIO (Documents/PlatformIO-Hello-world.md).
# Le nom du fichier est celui du document, sans .md. Voir GUIDE.md, « Quiz de compréhension ».
titre: Quiz de compréhension
nombre: 10   # questions tirées au hasard dans la banque à chaque essai
questions:
  - question: "PlatformIO s'installe comme une extension de Visual Studio Code."
    type: vf
    reponse: vrai
    explication: "On ajoute l'extension « PlatformIO IDE » à VS Code (Installation)."

  - question: "Environ combien de cartes de développement PlatformIO supporte-t-il?"
    choix: ["Une dizaine", "Une centaine", "Plus de 1000", "Seulement les cartes Arduino"]
    reponse: 3
    explication: "Plus de 1000 cartes et plus de 50 plateformes : Arduino, ESP32, STM32, Raspberry Pi Pico… (Définition)."

  - question: "Dans un projet PlatformIO, dans quel dossier se trouvent les fichiers source (.cpp)?"
    choix: ["include/", "lib/", "src/", "test/"]
    reponse: 3
    explication: "src/ pour les sources, include/ pour les en-têtes, lib/ pour les librairies, test/ pour les tests (section 1.1)."

  - question: "Dans quel dossier place-t-on les fichiers d'en-tête (.h)?"
    choix: ["src/", "include/", "lib/", "logs/"]
    reponse: 2
    explication: "Par exemple include/main.h (sections 1.1 et 6)."

  - question: "Le dossier lib/ d'un projet PlatformIO sert aux tests unitaires."
    type: vf
    reponse: faux
    explication: "lib/ reçoit les librairies personnalisées; les tests vont dans test/ (section 1.1)."

  - question: "Quel fichier centralise la configuration d'un projet PlatformIO?"
    choix: ["main.cpp", "platformio.ini", "main.h", "settings.json"]
    reponse: 2
    explication: "Toutes les configurations du projet (carte, librairies, moniteur…) sont dans platformio.ini (section 7)."

  - question: "Comme l'IDE Arduino, PlatformIO utilise des fichiers .ino pour le code principal."
    type: vf
    reponse: faux
    explication: "PlatformIO utilise des fichiers .cpp standard C++ (section 1.3)."

  - question: "Quelle ligne est obligatoire au début de main.cpp sous PlatformIO?"
    choix: ["#include <Arduino.h>", "#include \"main.h\"", "#define ARDUINO", "#include <stdio.h>"]
    reponse: 1
    explication: "Contrairement aux .ino, les .cpp doivent inclure explicitement la librairie Arduino (sections 1.3 et 9)."

  - question: "Que fait l'instruction Serial.begin(9600)?"
    choix:
      - "Elle attend 9600 millisecondes"
      - "Elle initialise la communication série à 9600 bauds"
      - "Elle allume la broche 9600"
      - "Elle affiche le nombre 9600 dans le moniteur série"
    reponse: 2
    explication: "Elle prépare la communication série; Serial.println() affiche ensuite les messages (section 1.3)."

  - question: "Quelle instruction affiche un message dans le moniteur série?"
    choix: ["digitalWrite()", "Serial.begin()", "Serial.println()", "pinMode()"]
    reponse: 3
    explication: "Serial.println(\"Bonjour le Monde!\") (section 1.3)."

  - question: "Quel raccourci clavier compile le projet?"
    choix: ["Ctrl + Alt + B", "Ctrl + Alt + U", "Ctrl + Alt + S", "Ctrl + Alt + C"]
    reponse: 1
    explication: "B pour Build (sections 2 et 8)."

  - question: "Quel raccourci clavier téléverse l'application vers le microcontrôleur?"
    choix: ["Ctrl + Alt + B", "Ctrl + Alt + U", "Ctrl + Alt + S", "Ctrl + Shift + P"]
    reponse: 2
    explication: "U pour Upload (sections 3 et 8)."

  - question: "Quel raccourci clavier ouvre le moniteur série?"
    choix: ["Ctrl + Alt + C", "Ctrl + Alt + B", "Ctrl + Alt + S", "Ctrl + Alt + U"]
    reponse: 3
    explication: "S pour Serial (sections 4 et 8)."

  - question: "Le raccourci Ctrl + Alt + C sert à nettoyer le projet."
    type: vf
    reponse: vrai
    explication: "Voir le tableau des raccourcis (section 8)."

  - question: "La compilation téléverse aussi le programme sur la carte."
    type: vf
    reponse: faux
    explication: "La compilation vérifie le code sans le téléverser; c'est utile pour détecter rapidement les erreurs (section 2)."

  - question: "Le téléversement compile automatiquement le projet si c'est nécessaire."
    type: vf
    reponse: vrai
    explication: "Il compile au besoin, puis transfère le programme vers la carte (section 3)."

  - question: "Que signifie la compilation incrémentale?"
    choix:
      - "Le programme est compilé une ligne à la fois"
      - "Seuls les fichiers modifiés sont recompilés"
      - "Le numéro de version augmente à chaque compilation"
      - "La compilation utilise un seul cœur du processeur"
    reponse: 2
    explication: "C'est ce qui rend la compilation de PlatformIO plus rapide (Pourquoi PlatformIO : « Compilation et téléversement optimisés »)."

  - question: "Quel filtre de monitor_filters enregistre les messages du moniteur série dans un fichier?"
    choix: ["default", "time", "colorize", "log2file"]
    reponse: 4
    explication: "Le fichier device-monitor-…log est créé dans le dossier logs du projet; time ajoute l'horodatage (sections 4 et 5.1)."

  - question: "Le filtre « time » de monitor_filters ajoute l'horodatage des lignes du moniteur série."
    type: vf
    reponse: vrai
    explication: "« default » retire les caractères de contrôle, « log2file » écrit dans un fichier (section 5.1)."

  - question: "Que fait pinMode(13, 1)?"
    choix:
      - "Elle allume la DEL de la broche 13"
      - "Elle configure la broche 13 en sortie (OUTPUT)"
      - "Elle lit l'état de la broche 13"
      - "Elle attend 13 millisecondes"
    reponse: 2
    explication: "OUTPUT vaut 1; c'est digitalWrite(13, 1) qui allume la DEL (section 5.1)."

  - question: "Dans l'exemple de la DEL qui clignote, que fait delay(500)?"
    choix: ["Il attend 500 microsecondes", "Il attend 500 millisecondes", "Il attend 500 secondes", "Il répète la boucle 500 fois"]
    reponse: 2
    explication: "La DEL reste allumée 500 ms, puis éteinte 500 ms (section 5.1)."

  - question: "digitalWrite(13, 0) éteint la DEL reliée à la broche 13."
    type: vf
    reponse: vrai
    explication: "0 correspond à LOW (éteint), 1 à HIGH (allumé) (section 5.1)."

  - question: "Les macros (#define) occupent de la mémoire vive du microcontrôleur pendant l'exécution."
    type: vf
    reponse: faux
    explication: "Elles sont remplacées lors de la compilation : pas de coût en mémoire (section 5.2)."

  - question: "Quelle est une bonne pratique pour nommer une macro?"
    choix:
      - "Un nom court comme D1"
      - "Un nom en minuscules"
      - "Un nom descriptif en MAJUSCULES, comme DEL_ROUGE"
      - "Un nom qui commence par un chiffre"
    reponse: 3
    explication: "Des noms en majuscules et descriptifs (DEL_ROUGE plutôt que D1) (section 5.2)."

  - question: "À quoi servent les directives #ifndef, #define et #endif dans un fichier .h?"
    choix:
      - "À accélérer la compilation"
      - "À éviter les inclusions multiples du fichier"
      - "À déclarer des variables globales"
      - "À choisir la carte cible"
    reponse: 2
    explication: "La garde d'inclusion (MAIN_H) évite les erreurs quand le fichier est inclus plusieurs fois (section 6)."

  - question: "Pour utiliser le fichier include/main.h dans main.cpp, quelle ligne faut-il ajouter?"
    choix: ["#include <main.h>", "#include \"main.h\"", "#define main.h", "import main.h"]
    reponse: 2
    explication: "Les guillemets désignent un fichier du projet; les chevrons, une librairie (section 6)."

  - question: "Dans platformio.ini, quel paramètre liste les librairies du projet, avec leurs versions?"
    choix: ["build_flags", "lib_deps", "board", "monitor_filters"]
    reponse: 2
    explication: "Par exemple : adafruit/DHT sensor library @ ^1.4.4 (section 7)."

  - question: "Dans platformio.ini, à quoi sert le paramètre monitor_speed?"
    choix:
      - "À la vitesse de téléversement"
      - "À la vitesse du moniteur série"
      - "À la fréquence de l'horloge du microcontrôleur"
      - "Au nombre de cœurs utilisés pour compiler"
    reponse: 2
    explication: "Il doit correspondre à Serial.begin() (9600). upload_speed règle le téléversement (section 7)."

  - question: "Le paramètre build_flags permet de définir des macros pour la compilation, comme -DDEBUG=1."
    type: vf
    reponse: vrai
    explication: "C'est comme écrire #define DEBUG 1 dans le code (section 7)."

  - question: "Pour l'Arduino Uno, quelle valeur prend le paramètre board dans platformio.ini?"
    choix: ["atmelavr", "arduino", "uno", "atmega328p"]
    reponse: 3
    explication: "board = uno; platform = atmelavr et framework = arduino (section 7)."
