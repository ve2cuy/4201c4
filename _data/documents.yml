# Documents de l'accueil, dans l'ordre d'affichage.
#
# Pour ajouter un document : copier un bloc, puis le modifier.
#   section : plan, bases, capteurs, projet ou ressources (sections A à E)
#   numero  : facultatif; sans numéro, la carte affiche « + »
#   titre   : le texte de la carte
#   fichier : Documents/Nom.md (lien vers la page du site), un PDF ou une adresse https://…;
#             sans fichier, la carte est grisée avec la mention « sans page »
#   dessin  : un nom de fichier de _includes/dessins/, sans .svg
#   option  : facultatif, petite étiquette (TP02, optionnel…)
#   notes   : facultatif, ligne de détails en petit
#
# Dessins disponibles : accolades, bande-del, bits, bouton, carte-arduino, copier-coller, coupe, document, eeprom, horloge, infrarouge, lcd, liste, livres, microcontroleur, minuterie, mouvement, oeil, potentiometre, resistance-del, rfid, solutions, structure, terminal, thermometre, uart, wifi


